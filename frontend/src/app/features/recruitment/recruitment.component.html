<div class="page">
  <header class="page__header">
    <div>
      <h1>Recruitment</h1>
      <p>Create job posts and monitor candidate pipelines.</p>
    </div>
    <button mat-stroked-button color="primary" type="button" (click)="refresh()">
      <mat-icon>refresh</mat-icon>
      Refresh
    </button>
  </header>
  <mat-card>
    <mat-card-header>
      <mat-card-title>Publish job</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="publish()" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Job title</mat-label>
          <input matInput formControlName="title" />
          <mat-error *ngIf="form.controls.title.hasError('required')">Title is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Department</mat-label>
          <mat-select formControlName="departmentId" required>
            <mat-option value="hr">Human Resources</mat-option>
            <mat-option value="engineering">Engineering</mat-option>
            <mat-option value="sales">Sales</mat-option>
          </mat-select>
          <mat-error *ngIf="form.controls.departmentId.hasError('required')">Select a department</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="form-grid__full">
          <mat-label>Job description</mat-label>
          <textarea matInput formControlName="description" rows="4"></textarea>
          <mat-error *ngIf="form.controls.description.hasError('required')">Description required</mat-error>
        </mat-form-field>
        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="loading()">Publish</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
  <app-data-table
    [columns]="columns"
    [displayedColumns]="displayedColumns"
    [data]="jobs()"
    [total]="total()"
    [loading]="loading()"
    (queryChange)="onQueryChange($event)"
  ></app-data-table>
</div>
