<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-danger">
            <div>
              <h4 class="card-title">Recruitment</h4>
              <p class="card-category">Create job posts and oversee candidate pipelines.</p>
            </div>
            <div class="card-header__actions">
              <button mat-stroked-button color="primary" type="button" (click)="refresh()">
                <mat-icon>refresh</mat-icon>
                Refresh
              </button>
            </div>
          </div>
          <div class="card-body">
            <section class="feature-section">
              <div class="section-header">
                <h5>Publish job</h5>
              </div>
              <form [formGroup]="form" (ngSubmit)="publish()" class="form-grid">
                <mat-form-field appearance="outline">
                  <mat-label>Job title</mat-label>
                  <input matInput formControlName="title" />
                  <mat-error *ngIf="form.controls.title.hasError('required')">Title is required</mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline">
                  <mat-label>Department</mat-label>
                  <mat-select formControlName="departmentId" required>
                    <mat-option value="hr">Human Resources</mat-option>
                    <mat-option value="engineering">Engineering</mat-option>
                    <mat-option value="sales">Sales</mat-option>
                  </mat-select>
                  <mat-error *ngIf="form.controls.departmentId.hasError('required')">Select a department</mat-error>
                </mat-form-field>
                <mat-form-field appearance="outline" class="form-grid__full">
                  <mat-label>Job description</mat-label>
                  <textarea matInput formControlName="description" rows="4"></textarea>
                  <mat-error *ngIf="form.controls.description.hasError('required')">Description required</mat-error>
                </mat-form-field>
                <div class="form-actions">
                  <button mat-flat-button color="primary" type="submit" [disabled]="loading()">Publish</button>
                </div>
              </form>
            </section>

            <section class="feature-section">
              <div class="section-header">
                <h5>Open roles</h5>
                <p>Filter and manage job postings from a single table.</p>
              </div>
              <app-data-table
                [columns]="columns"
                [displayedColumns]="displayedColumns"
                [data]="jobs()"
                [total]="total()"
                [loading]="loading()"
                (queryChange)="onQueryChange($event)"
              ></app-data-table>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
