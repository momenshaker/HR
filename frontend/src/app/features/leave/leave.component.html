<div class="page">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Request time off</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Leave type</mat-label>
          <mat-select formControlName="typeId" required>
            <mat-option value="annual">Annual leave</mat-option>
            <mat-option value="sick">Sick leave</mat-option>
            <mat-option value="unpaid">Unpaid leave</mat-option>
          </mat-select>
          <mat-error *ngIf="form.controls.typeId.hasError('required')">Select a leave type</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Start date</mat-label>
          <input matInput type="date" formControlName="startDate" required />
          <mat-error *ngIf="form.controls.startDate.hasError('required')">Start date required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>End date</mat-label>
          <input matInput type="date" formControlName="endDate" required />
          <mat-error *ngIf="form.controls.endDate.hasError('required')">End date required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="form-grid__full">
          <mat-label>Reason</mat-label>
          <textarea matInput formControlName="reason" rows="3"></textarea>
        </mat-form-field>
        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="loading()">Submit request</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
  <app-data-table
    [columns]="columns"
    [displayedColumns]="displayedColumns"
    [data]="requests()"
    [total]="total()"
    [loading]="loading()"
    (queryChange)="onQueryChange($event)"
  ></app-data-table>
</div>
