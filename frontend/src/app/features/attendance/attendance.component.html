<div class="page">
  <header class="page__header">
    <h1>Attendance</h1>
    <button mat-stroked-button color="primary" (click)="refresh()">
      <mat-icon>refresh</mat-icon>
      Refresh
    </button>
  </header>
  <section class="attendance-form">
    <h2>Record attendance</h2>
    <form [formGroup]="createForm" (ngSubmit)="submit()" class="attendance-form__grid">
      <mat-form-field appearance="outline">
        <mat-label>Employee</mat-label>
        <mat-select formControlName="employeeId">
          <mat-option *ngFor="let employee of employees" [value]="employee.id">
            {{ employee.fullName }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="createForm.controls.employeeId.hasError('required')">Employee is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Work date</mat-label>
        <input matInput type="date" formControlName="workDate" />
        <mat-error *ngIf="createForm.controls.workDate.hasError('required')">Date is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Shift name</mat-label>
        <input matInput formControlName="shiftName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="InProgress">In progress</mat-option>
          <mat-option value="Completed">Completed</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Overtime (minutes)</mat-label>
        <input matInput type="number" formControlName="overtimeMinutes" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Notes</mat-label>
        <input matInput formControlName="notes" />
      </mat-form-field>
      <div formArrayName="punches" class="attendance-form__punches">
        <h3>Punches</h3>
        <div
          class="attendance-form__punch"
          *ngFor="let control of punchControls.controls; index as i"
          [formGroupName]="i"
        >
          <mat-form-field appearance="outline">
            <mat-label>Type</mat-label>
            <input matInput formControlName="type" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Timestamp</mat-label>
            <input matInput type="datetime-local" formControlName="timestamp" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Notes</mat-label>
            <input matInput formControlName="notes" />
          </mat-form-field>
          <button mat-icon-button type="button" color="warn" (click)="removePunch(i)" *ngIf="punchControls.length > 1">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <button mat-stroked-button type="button" (click)="addPunch()">
          <mat-icon>add</mat-icon>
          Add punch
        </button>
      </div>
      <button mat-raised-button color="primary" type="submit">Submit attendance</button>
    </form>
  </section>
  <app-date-range-picker [form]="filterForm"></app-date-range-picker>
  <app-data-table
    [columns]="columns"
    [displayedColumns]="displayedColumns"
    [data]="records()"
    [total]="total()"
    [loading]="loading()"
    (queryChange)="onQueryChange($event)"
  ></app-data-table>
</div>
