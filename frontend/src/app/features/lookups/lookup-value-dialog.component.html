<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="lookup-dialog__form">
    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <input matInput formControlName="category" [matAutocomplete]="categoryList" />
      <mat-autocomplete #categoryList="matAutocomplete">
        <mat-option *ngFor="let option of categories" [value]="option">{{ option }}</mat-option>
      </mat-autocomplete>
      <mat-hint>Type a new category name to create it.</mat-hint>
      <mat-error *ngIf="form.get('category')?.hasError('required')">Category is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" maxlength="100" />
      <mat-error *ngIf="form.get('code')?.hasError('required')">Code is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Display name</mat-label>
      <input matInput formControlName="displayName" maxlength="200" />
      <mat-error *ngIf="form.get('displayName')?.hasError('required')">Display name is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description" maxlength="512"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sort order</mat-label>
      <input matInput type="number" formControlName="sortOrder" min="1" />
    </mat-form-field>

    <mat-slide-toggle formControlName="isActive">Active</mat-slide-toggle>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close type="button">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">
    {{ data.value ? 'Save changes' : 'Create value' }}
  </button>
</mat-dialog-actions>
