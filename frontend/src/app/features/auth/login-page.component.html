<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>HR Platform Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-error *ngIf="form.controls.email.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.controls.email.hasError('email')">Enter a valid email</mat-error>
          <mat-error *ngIf="form.controls.email.hasError('server')">{{ form.controls.email.getError('server') }}</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" />
          <mat-error *ngIf="form.controls.password.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="form.controls.password.hasError('server')">{{ form.controls.password.getError('server') }}</mat-error>
        </mat-form-field>
        <mat-checkbox formControlName="rememberMe">Remember me</mat-checkbox>
        <div class="login-actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
            <mat-icon *ngIf="loading()" class="spinner" fontIcon="hourglass_top"></mat-icon>
            Sign in
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
