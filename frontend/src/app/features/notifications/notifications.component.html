<div class="page">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Broadcast notification</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="send()" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" />
          <mat-error *ngIf="form.controls.title.hasError('required')">Title is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Audience</mat-label>
          <input matInput formControlName="audience" />
          <mat-error *ngIf="form.controls.audience.hasError('required')">Audience required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="form-grid__full">
          <mat-label>Message</mat-label>
          <textarea matInput formControlName="body" rows="4"></textarea>
          <mat-error *ngIf="form.controls.body.hasError('required')">Message required</mat-error>
        </mat-form-field>
        <div class="form-actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="loading()">Send</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
  <mat-card>
    <mat-card-header>
      <mat-card-title>Recent notifications</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        <mat-list-item *ngFor="let notification of items()">
          <div matListItemTitle>{{ notification.title }}</div>
          <div matListItemLine>{{ notification.body }}</div>
          <div matListItemLine class="meta">{{ notification.audience }} • {{ notification.createdAt | date: 'medium' }}</div>
        </mat-list-item>
        <p *ngIf="!items().length" class="empty">No notifications yet.</p>
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
