openapi: 3.0.3
info:
  title: HR Platform Public API
  version: 0.4.1
  description: |
    Public API surface for platform health, authentication, subscription lifecycle, and billing integrations.
    All protected endpoints require JWT bearer authentication issued by the login endpoint.
  contact:
    name: Hercules IT Solutions
    email: info@herculesit.com
    url: https://www.herculesit.com
  license:
    name: Proprietary
    url: https://www.herculesit.com/legal
servers:
  - url: https://localhost:5001
    description: Local development server
  - url: https://api.hr.herculesit.com
    description: Production environment
security:
  - BearerAuth: []
tags:
  - name: System
    description: Platform diagnostics and metadata.
  - name: Analytics
    description: Read-only HR analytics endpoints for aggregates.
  - name: Authentication
    description: Identity and session management endpoints.
  - name: Audit
    description: Access audit streams for compliance oversight.
  - name: Billing
    description: Billing integrations, plans, and consumption reporting.
  - name: Subscriptions
    description: Subscription lifecycle management.
  - name: Performance
    description: Goals, review cycles, and performance reviews.
  - name: Training
    description: Lightweight training courses, sessions, and enrollments.
  - name: Communication
    description: Organization and departmental announcements.
  - name: Lookups
    description: Dynamic lookup categories and values with cache validation.
  - name: Leave
    description: Leave types, balances, and lifecycle management endpoints.
paths:
  /api/v1/leave/types:
    get:
      tags: [Leave]
      summary: List leave types
      description: Returns configured leave types along with entitlement metadata and UI hints.
      responses:
        '200':
          description: Leave types visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveTypeDto'
  /api/v1/leave/balances:
    get:
      tags: [Leave]
      summary: Retrieve leave balances for an employee
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Leave balances per leave type for the employee and year.
          content:
            application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/LeaveBalanceDto'
    post:
      tags: [Leave]
      summary: Set leave balances for the selected types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLeaveBalancesRequest'
      responses:
        '200':
          description: Updated balance snapshots for the employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveBalanceDto'
  /api/v1/leave/requests:
    get:
      tags: [Leave]
      summary: Search leave requests
      description: Returns a paginated list of leave requests filtered by employee, manager, or status.
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: managerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            description: Optional status filter (e.g. Draft, PendingApproval, Approved, Rejected, Cancelled).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Paginated leave requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLeaveRequestsDto'
    post:
      tags: [Leave]
      summary: Create or submit a leave request
      description: Creates a draft leave request when <code>draft</code> is true, otherwise submits immediately for approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLeaveRequestInput'
      responses:
        '201':
          description: Newly created leave request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDto'
  /api/v1/leave/requests/{requestId}:
    get:
      tags: [Leave]
      summary: Retrieve a leave request by id
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leave request details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDto'
        '404':
          description: Leave request not found.
  /api/v1/leave/requests/{requestId}:submit:
    post:
      tags: [Leave]
      summary: Submit a draft leave request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated leave request after submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDto'
        '400':
          description: Request is not in Draft status or failed validation.
        '404':
          description: Leave request not found.
  /api/v1/leave/requests/{requestId}:approve:
    post:
      tags: [Leave]
      summary: Approve a leave request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: managerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leave request after approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDto'
        '404':
          description: Leave request not found.
  /api/v1/leave/requests/{requestId}:reject:
    post:
      tags: [Leave]
      summary: Reject a leave request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: managerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Reason for rejection.
      responses:
        '200':
          description: Leave request after rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDto'
        '404':
          description: Leave request not found.
  /api/v1/leave/requests/{requestId}:cancel:
    post:
      tags: [Leave]
      summary: Cancel a leave request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Leave request after cancellation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestDto'
        '404':
          description: Leave request not found.
  /api/health:
    get:
      tags: [System]
      summary: Report API health status
      description: Returns the current health status of the API along with the environment context.
      security: []
      responses:
        '200':
          description: Health status payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthDto'
  /api/version:
    get:
      tags: [System]
      summary: Retrieve API version information
      description: Provides the running assembly version paired with the active hosting environment.
      security: []
      responses:
        '200':
          description: Version metadata payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemVersionDto'
  /api/analytics/headcount:
    get:
      tags: [Analytics]
      summary: Headcount per department
      description: Returns active employee headcount grouped by department (optionally scoped to a department subtree).
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Headcount per department.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HeadcountItem'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/analytics/utilization:
    get:
      tags: [Analytics]
      summary: Timesheet utilization by period
      description: Approved hours divided by capacity per weekly period within the date range.
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Utilization per week.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UtilizationPeriod'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/analytics/leave-usage:
    get:
      tags: [Analytics]
      summary: Leave usage by type
      description: Approved leave counts grouped by leave type for the specified year.
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Leave usage totals per leave type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveUsageItem'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/analytics/payroll-totals:
    get:
      tags: [Analytics]
      summary: Payroll totals per run and department
      description: Aggregates gross and net totals for runs in range, with optional department breakdown.
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Payroll totals per run and per department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollTotalsResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/analytics/recruitment-funnel:
    get:
      tags: [Analytics]
      summary: Recruitment funnel by stage
      description: Counts of candidates/interviews per pipeline stage for the given vacancy.
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stage counts for vacancy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StageCount'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/analytics/training-compliance:
    get:
      tags: [Analytics]
      summary: Mandatory training compliance
      description: Overall completion rate for mandatory lightweight courses.
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Training compliance summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingCompliance'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/audit:
    get:
      tags: [Audit]
      summary: List audit log entries
      description: Retrieves a paginated list of audit events generated by protected operations.
      parameters:
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
      responses:
        '200':
          description: Paged audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntryDto'
                  page:
                    type: integer
                    format: int32
                  pageSize:
                    type: integer
                    format: int32
                  totalRecords:
                    type: integer
                    format: int64
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/billing/plans:
    get:
      tags: [Billing]
      summary: Retrieve billing plans
      description: Returns the available billing plans and pricing tiers.
      responses:
        '200':
          description: A collection of plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/billing/usage:
    get:
      tags: [Billing]
      summary: Retrieve usage snapshots
      description: Provides aggregated usage details for metered billing.
      parameters:
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
        - name: from
          in: query
          description: Optional inclusive UTC start of the reporting window.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Optional exclusive UTC end of the reporting window.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Usage snapshots grouped by billing period.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageSnapshotDto'
                  page:
                    type: integer
                    format: int32
                  pageSize:
                    type: integer
                    format: int32
                  totalRecords:
                    type: integer
                    format: int64
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/subscriptions:
    get:
      tags: [Subscriptions]
      summary: List subscriptions
      description: Retrieves subscriptions visible to the caller.
      parameters:
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
        - name: status
          in: query
          description: Optional status filter.
          schema:
            type: string
            enum: [Active, Inactive, Canceled, PastDue]
      responses:
        '200':
          description: Paged subscription list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionDto'
                  page:
                    type: integer
                    format: int32
                  pageSize:
                    type: integer
                    format: int32
                  totalRecords:
                    type: integer
                    format: int64
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: Provisions a new subscription instance for the calling tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Newly created subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Subscription identifier.
        schema:
          type: string
          format: uuid
    get:
      tags: [Subscriptions]
      summary: Get subscription by id
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found.
    put:
      tags: [Subscriptions]
      summary: Update subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found.
    delete:
      tags: [Subscriptions]
      summary: Cancel subscription
      responses:
        '204':
          description: Subscription canceled.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found.
  /api/subscriptions/{id}/invoice:
    get:
      tags: [Subscriptions]
      summary: Retrieve latest invoice for subscription
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice summary for the subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found.
  /api/billing/webhooks/stripe:
    post:
      tags: [Billing]
      summary: Receive Stripe webhook notifications
      description: Ingests Stripe webhook events for billing lifecycle automation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Stripe event identifier.
                type:
                  type: string
                  description: Stripe event type.
                created:
                  type: integer
                  format: int64
                  description: Unix timestamp of the event.
                data:
                  type: object
                  description: Raw Stripe event payload.
      responses:
        '202':
          description: Webhook accepted for processing.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials
      description: Exchanges credentials for a JWT bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/performance/cycles:
    get:
      tags: [Performance]
      summary: List review cycles
      description: Retrieves performance review cycles with optional open-state filter.
      parameters:
        - name: isOpen
          in: query
          description: Optional filter to return only open or only closed cycles.
          schema:
            type: boolean
      responses:
        '200':
          description: A collection of review cycles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewCycleDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/training/courses:
    get:
      tags: [Training]
      summary: List courses for organization
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiteCourseDto'
    post:
      tags: [Training]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiteCourseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteCourseDto'
  /api/training/courses/{id}/sessions:
    get:
      tags: [Training]
      summary: List sessions for a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiteCourseSessionDto'
  /api/training/sessions:
    post:
      tags: [Training]
      summary: Create a course session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiteCourseSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteCourseSessionDto'
  /api/training/sessions/{sessionId}/enroll:
    post:
      tags: [Training]
      summary: Enroll an employee in a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteEnrollmentDto'
  /api/training/sessions/{sessionId}/complete:
    post:
      tags: [Training]
      summary: Mark an enrollment as completed
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enrollment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteEnrollmentDto'
  /api/training/sessions/{sessionId}/cancel:
    post:
      tags: [Training]
      summary: Cancel an enrollment
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enrollment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteEnrollmentDto'
    post:
      tags: [Performance]
      summary: Create a review cycle
      description: Creates a new performance review cycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewCycleRequest'
      responses:
        '201':
          description: Newly created review cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycleDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/performance/cycles/{id}:open:
