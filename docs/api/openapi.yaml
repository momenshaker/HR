      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        body:
          type: string
        publishedAtUtc:
          type: string
          format: date-time
        publishedById:
          type: string
          format: uuid
        isPinned:
          type: boolean
