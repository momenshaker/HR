  /api/comms/announcements:
    get:
      tags: [Communication]
      summary: List announcements
      description: |
        Lists organization and department announcements. Pinned items appear first, then newest by publish time.
        When `unreadForEmployeeId` is provided, returns only announcements not yet read by that employee
        in the organization scope and any of their departments.
      parameters:
        - name: orgId
          in: query
          required: true
          description: Organization identifier.
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          required: false
          description: Optional department filter. Includes org-wide items when specified.
          schema:
            type: string
            format: uuid
        - name: unreadForEmployeeId
          in: query
          required: false
          description: If provided, returns only unread announcements for the employee.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          description: 1-based page index (defaults to 1).
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of items to return per page (defaults to 25).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: Paged announcements list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommsAnnouncementDto'
                  page:
                    type: integer
                    format: int32
                  pageSize:
                    type: integer
                    format: int32
                  totalRecords:
                    type: integer
                    format: int64
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Communication]
      summary: Publish announcement
      description: Creates a new organization or department announcement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommsAnnouncementRequest'
      responses:
        '201':
          description: Created announcement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommsAnnouncementDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/comms/announcements/{id}:pin:
    post:
      tags: [Communication]
      summary: Pin announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Announcement pinned.
        '404':
          description: Announcement not found.
  /api/comms/announcements/{id}:unpin:
    post:
      tags: [Communication]
      summary: Unpin announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Announcement unpinned.
        '404':
          description: Announcement not found.
  /api/comms/announcements/{id}:read:
    post:
      tags: [Communication]
      summary: Mark announcement read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Read receipt recorded.
        '400':
          description: Missing or invalid employeeId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/lookups:
    get:
      tags: [Lookups]
      summary: List lookup categories and values
      description: Returns all lookup categories with their values plus a version token for cache validation.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Lookup collection payload.
          headers:
            ETag:
              description: Strong ETag derived from the lookup collection version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupCollectionDto'
        '304':
          description: Not modified. The caller's cached version is still valid.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Lookups]
      summary: Create lookup value
      description: Adds a lookup value to the specified category. Categories are created automatically when new names are provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLookupValueRequest'
      responses:
        '201':
          description: Created lookup value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupValueDto'
        '409':
          description: Lookup code already exists within the category.
        '422':
          description: Validation failed.
  /api/v1/lookups/category/{category}:
    get:
      tags: [Lookups]
      summary: List lookup values by category
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lookup values within the category.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupValueDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/lookups/value/{id}:
    get:
      tags: [Lookups]
      summary: Get lookup value by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lookup value details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupValueDto'
        '404':
          description: Lookup value not found.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/lookups/{id}:
    put:
      tags: [Lookups]
      summary: Update lookup value
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLookupValueRequest'
      responses:
        '200':
          description: Updated lookup value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupValueDto'
        '404':
          description: Lookup value not found.
        '409':
          description: Lookup code already exists within the category.
        '422':
          description: Validation failed.
    delete:
      tags: [Lookups]
      summary: Delete lookup value
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Lookup value deleted.
        '404':
          description: Lookup value not found.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide the access token obtained from the login endpoint.
  parameters:
    PageParameter:
      name: page
      in: query
      description: Zero-based page index (defaults to 0).
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    PageSizeParameter:
      name: pageSize
      in: query
      description: Number of items to return per page (defaults to 25).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 25
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Provide the previously returned ETag to receive 304 responses when no changes occurred.
      schema:
        type: string
  schemas:
    LookupValueDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        code:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          format: int32
        isActive:
          type: boolean
        updatedAtUtc:
          type: string
          format: date-time
      required: [id, category, code, displayName, sortOrder, isActive, updatedAtUtc]
    LookupCategoryDto:
      type: object
      properties:
        category:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/LookupValueDto'
      required: [category, values]
    LookupCollectionDto:
      type: object
      properties:
        versionToken:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/LookupCategoryDto'
      required: [versionToken, categories]
    LeaveTypeDto:
      type: object
      required: [id, code, name, isPaid, requiresApproval, requiresAttachment, annualAllowanceDays, carryOverDays]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        isPaid:
          type: boolean
        requiresApproval:
          type: boolean
        requiresAttachment:
          type: boolean
        annualAllowanceDays:
          type: number
          format: double
        carryOverDays:
          type: number
          format: double
        maxConsecutiveDays:
          type: integer
          format: int32
          nullable: true
        color:
          type: string
    LeaveBalanceDto:
      type: object
      required: [employeeId, leaveTypeId, year, openingBalance, accrued, taken, carriedForward, reserved, remaining]
      properties:
        employeeId:
          type: string
          format: uuid
        leaveTypeId:
          type: string
          format: uuid
        year:
          type: integer
          format: int32
        openingBalance:
          type: number
          format: double
        accrued:
          type: number
          format: double
        taken:
          type: number
          format: double
        carriedForward:
          type: number
          format: double
        reserved:
          type: number
          format: double
        remaining:
          type: number
          format: double
    SetLeaveBalancesRequest:
      type: object
      required: [employeeId, year, balances]
      properties:
        employeeId:
          type: string
          format: uuid
        year:
          type: integer
          format: int32
        balances:
          type: array
          items:
            $ref: '#/components/schemas/LeaveBalanceAdjustmentDto'
    LeaveBalanceAdjustmentDto:
      type: object
      required: [leaveTypeId, remaining]
      properties:
        leaveTypeId:
          type: string
          format: uuid
        remaining:
          type: number
          format: double
    LeaveRequestDto:
      type: object
      required:
        - id
        - employeeId
        - leaveTypeId
        - leaveType
        - startDate
        - endDate
        - numberOfDays
        - status
        - reason
        - submittedAtUtc
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        leaveTypeId:
          type: string
          format: uuid
        leaveType:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        numberOfDays:
          type: number
          format: double
        status:
          type: string
        approverId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
        attachmentPath:
          type: string
          nullable: true
        submittedAtUtc:
          type: string
          format: date-time
        approvedAtUtc:
          type: string
          format: date-time
          nullable: true
        rejectedAtUtc:
          type: string
          format: date-time
          nullable: true
        cancelledAtUtc:
          type: string
          format: date-time
          nullable: true
    PagedLeaveRequestsDto:
      type: object
      required: [page, pageSize, totalCount, items]
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaveRequestDto'
    NewLeaveRequestInput:
      type: object
      required: [employeeId, leaveTypeId, startDate, endDate]
      properties:
        employeeId:
          type: string
          format: uuid
        leaveTypeId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
          maxLength: 500
        attachmentPath:
          type: string
          nullable: true
          maxLength: 260
        draft:
          type: boolean
          description: When true the request remains in Draft status until submitted.
          default: false
    CreateLookupValueRequest:
      type: object
      properties:
        category:
          type: string
        code:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          nullable: true
        isActive:
          type: boolean
          default: true
      required: [category, code, displayName]
    UpdateLookupValueRequest:
      type: object
      properties:
        category:
          type: string
        code:
          type: string
        displayName:
          type: string
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          nullable: true
        isActive:
          type: boolean
      required: [category, code, displayName, isActive]
    HeadcountItem:
      type: object
      properties:
        DepartmentId:
          type: string
          format: uuid
        DepartmentName:
          type: string
        Count:
          type: integer
          format: int32
    UtilizationPeriod:
      type: object
      properties:
        PeriodStart:
          type: string
          format: date
        PeriodEnd:
          type: string
          format: date
        ApprovedHours:
          type: number
          format: double
        CapacityHours:
          type: number
          format: double
        UtilizationRate:
          type: number
          format: double
          description: ApprovedHours/CapacityHours (0..1)
    LeaveUsageItem:
      type: object
      properties:
        LeaveType:
          type: string
        Days:
          type: integer
          format: int32
    PayrollTotalsResponse:
      type: object
      properties:
        Runs:
          type: array
          items:
            type: object
            properties:
              RunId: { type: string, format: uuid }
              PeriodStart: { type: string, format: date }
              PeriodEnd: { type: string, format: date }
              TotalGross: { type: number, format: double }
              TotalNet: { type: number, format: double }
        ByDepartment:
          type: array
          items:
            type: object
            properties:
              DepartmentId: { type: string, format: uuid }
              DepartmentName: { type: string }
              TotalGross: { type: number, format: double }
              TotalNet: { type: number, format: double }
    StageCount:
      type: object
      properties:
        Stage:
          type: string
        Count:
          type: integer
          format: int32
    TrainingCompliance:
      type: object
      properties:
        OrganizationId: { type: string, format: uuid }
        MandatoryCourseCount: { type: integer, format: int32 }
        ObservedEmployeeCount: { type: integer, format: int32 }
        CompliantEmployeeCount: { type: integer, format: int32 }
        ComplianceRate: { type: number, format: double }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine readable error code.
        message:
          type: string
          description: Human readable error message.
        traceId:
          type: string
          description: Distributed trace identifier when available.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
