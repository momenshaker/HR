openapi: 3.0.3
info:
  title: HR Platform Public API
  version: 0.4.0
  description: |
    Public API surface for platform health, authentication, subscription lifecycle, and billing integrations.
    All protected endpoints require JWT bearer authentication issued by the login endpoint.
  contact:
    name: Hercules IT Solutions
    email: info@herculesit.com
    url: https://www.herculesit.com
  license:
    name: Proprietary
    url: https://www.herculesit.com/legal
servers:
  - url: https://localhost:5001
    description: Local development server
  - url: https://api.hr.herculesit.com
    description: Production environment
security:
  - BearerAuth: []
tags:
  - name: System
    description: Platform diagnostics and metadata.
  - name: Authentication
    description: Identity and session management endpoints.
  - name: Audit
    description: Access audit streams for compliance oversight.
  - name: Billing
    description: Billing integrations, plans, and consumption reporting.
  - name: Subscriptions
    description: Subscription lifecycle management.
  - name: Performance
    description: Goals, review cycles, and performance reviews.
paths:
  /api/health:
    get:
      tags: [System]
      summary: Report API health status
      description: Returns the current health status of the API along with the environment context.
      security: []
      responses:
        '200':
          description: Health status payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthDto'
  /api/version:
    get:
      tags: [System]
      summary: Retrieve API version information
      description: Provides the running assembly version paired with the active hosting environment.
      security: []
      responses:
        '200':
          description: Version metadata payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemVersionDto'
  /api/audit:
    get:
      tags: [Audit]
      summary: List audit log entries
      description: Retrieves a paginated list of audit events generated by protected operations.
      parameters:
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
      responses:
        '200':
          description: Paged audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntryDto'
                  page:
                    type: integer
                    format: int32
                  pageSize:
                    type: integer
                    format: int32
                  totalRecords:
                    type: integer
                    format: int64
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/billing/plans:
    get:
      tags: [Billing]
      summary: Retrieve billing plans
      description: Returns the available billing plans and pricing tiers.
      responses:
        '200':
          description: A collection of plans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/billing/usage:
    get:
      tags: [Billing]
      summary: Retrieve usage snapshots
      description: Provides aggregated usage details for metered billing.
      parameters:
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
        - name: from
          in: query
          description: Optional inclusive UTC start of the reporting window.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Optional exclusive UTC end of the reporting window.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Usage snapshots grouped by billing period.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageSnapshotDto'
                  page:
                    type: integer
                    format: int32
                  pageSize:
                    type: integer
                    format: int32
                  totalRecords:
                    type: integer
                    format: int64
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/subscriptions:
    get:
      tags: [Subscriptions]
      summary: List subscriptions
      description: Retrieves subscriptions visible to the caller.
      parameters:
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/PageSizeParameter'
        - name: status
          in: query
          description: Optional status filter.
          schema:
            type: string
            enum: [Active, Inactive, Canceled, PastDue]
      responses:
        '200':
          description: Paged subscription list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionDto'
                  page:
                    type: integer
                    format: int32
                  pageSize:
                    type: integer
                    format: int32
                  totalRecords:
                    type: integer
                    format: int64
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: Provisions a new subscription instance for the calling tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Newly created subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Subscription identifier.
        schema:
          type: string
          format: uuid
    get:
      tags: [Subscriptions]
      summary: Get subscription by id
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found.
    put:
      tags: [Subscriptions]
      summary: Update subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found.
    delete:
      tags: [Subscriptions]
      summary: Cancel subscription
      responses:
        '204':
          description: Subscription canceled.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found.
  /api/subscriptions/{id}/invoice:
    get:
      tags: [Subscriptions]
      summary: Retrieve latest invoice for subscription
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice summary for the subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Subscription not found.
  /api/billing/webhooks/stripe:
    post:
      tags: [Billing]
      summary: Receive Stripe webhook notifications
      description: Ingests Stripe webhook events for billing lifecycle automation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Stripe event identifier.
                type:
                  type: string
                  description: Stripe event type.
                created:
                  type: integer
                  format: int64
                  description: Unix timestamp of the event.
                data:
                  type: object
                  description: Raw Stripe event payload.
      responses:
        '202':
          description: Webhook accepted for processing.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials
      description: Exchanges credentials for a JWT bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/performance/cycles:
    get:
      tags: [Performance]
      summary: List review cycles
      description: Retrieves performance review cycles with optional open-state filter.
      parameters:
        - name: isOpen
          in: query
          description: Optional filter to return only open or only closed cycles.
          schema:
            type: boolean
      responses:
        '200':
          description: A collection of review cycles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewCycleDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Performance]
      summary: Create a review cycle
      description: Creates a new performance review cycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewCycleRequest'
      responses:
        '201':
          description: Newly created review cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycleDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/performance/cycles/{id}:open:
    post:
      tags: [Performance]
      summary: Open a review cycle
      parameters:
        - name: id
          in: path
          required: true
          description: Review cycle identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Opened review cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycleDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Review cycle not found.
  /api/performance/cycles/{id}:close:
    post:
      tags: [Performance]
      summary: Close a review cycle
      parameters:
        - name: id
          in: path
          required: true
          description: Review cycle identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Closed review cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCycleDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Review cycle not found.
  /api/performance/reviews:
    get:
      tags: [Performance]
      summary: List reviews
      description: Retrieves performance reviews filtered by cycle, employee, and/or manager.
      parameters:
        - name: cycleId
          in: query
          description: Optional cycle identifier to filter reviews.
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          description: Optional employee identifier to filter reviews.
          schema:
            type: string
            format: uuid
        - name: managerId
          in: query
          description: Optional manager identifier to filter reviews.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A collection of reviews.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewDto'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Performance]
      summary: Create or submit a review
      description: Creates a new review draft or submits a review with ratings and comments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Created review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/performance/reviews/{id}:
    put:
      tags: [Performance]
      summary: Update review ratings and comments
      parameters:
        - name: id
          in: path
          required: true
          description: Review identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Updated review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDto'
        '400':
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Review not found.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide the access token obtained from the login endpoint.
  parameters:
    PageParameter:
      name: page
      in: query
      description: Zero-based page index (defaults to 0).
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    PageSizeParameter:
      name: pageSize
      in: query
      description: Number of items to return per page (defaults to 25).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 25
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine readable error code.
        message:
          type: string
          description: Human readable error message.
        traceId:
          type: string
          description: Distributed trace identifier when available.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Signed JWT token.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int32
          description: Token lifetime in seconds.
        refreshToken:
          type: string
          description: Optional refresh token for session extension.
    GoalDto:
      type: object
      required: [id, employeeId, title, startDate, dueDate, status, weight]
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum: [Active, Completed, Cancelled]
        weight:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        rowVersion:
          type: string
          description: Concurrency token for optimistic updates.
    ReviewCycleDto:
      type: object
      required: [id, organizationId, name, periodStart, periodEnd, isOpen]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        isOpen:
          type: boolean
    CreateReviewCycleRequest:
      type: object
      required: [organizationId, name, periodStart, periodEnd]
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
    ReviewKpiDto:
      type: object
      required: [id, name, rating]
      properties:
        id:
          type: string
          format: uuid
        reviewId:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        notes:
          type: string
          nullable: true
    ReviewDto:
      type: object
      required: [id, cycleId, employeeId, managerId]
      properties:
        id:
          type: string
          format: uuid
        cycleId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        overallRating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
        comments:
          type: string
          nullable: true
        submittedAtUtc:
          type: string
          format: date-time
          nullable: true
        rowVersion:
          type: string
          description: Concurrency token for optimistic updates.
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/ReviewKpiDto'
    CreateReviewRequest:
      type: object
      required: [cycleId, employeeId, managerId]
      properties:
        cycleId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        overallRating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
        comments:
          type: string
          nullable: true
        submittedAtUtc:
          type: string
          format: date-time
          nullable: true
        kpis:
          type: array
          items:
            type: object
            required: [name, rating]
            properties:
              goalId:
                type: string
                format: uuid
                nullable: true
              name:
                type: string
              rating:
                type: integer
                format: int32
                minimum: 1
                maximum: 5
              notes:
                type: string
                nullable: true
    UpdateReviewRequest:
      type: object
      properties:
        overallRating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
        comments:
          type: string
          nullable: true
        submittedAtUtc:
          type: string
          format: date-time
          nullable: true
        kpis:
          type: array
          items:
            type: object
            required: [id, rating]
            properties:
              id:
                type: string
                format: uuid
              goalId:
                type: string
                format: uuid
                nullable: true
              name:
                type: string
              rating:
                type: integer
                format: int32
                minimum: 1
                maximum: 5
              notes:
                type: string
                nullable: true
    SubscriptionDto:
      type: object
      required: [id, planId, status, seats, createdAt]
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        status:
          type: string
          enum: [Active, Inactive, Canceled, PastDue]
        seats:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        canceledAt:
          type: string
          format: date-time
          nullable: true
        renewsAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
    CreateSubscriptionRequest:
      type: object
      required: [planId, seats]
      properties:
        planId:
          type: string
          format: uuid
        seats:
          type: integer
          format: int32
          minimum: 1
        trialPeriodDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 30
        paymentMethodId:
          type: string
          description: Identifier of the payment method to charge.
    UpdateSubscriptionRequest:
      type: object
      properties:
        planId:
          type: string
          format: uuid
        seats:
          type: integer
          format: int32
          minimum: 1
        status:
          type: string
          enum: [Active, Inactive, Canceled, PastDue]
        metadata:
          type: object
          additionalProperties:
            type: string
    InvoiceDto:
      type: object
      required: [id, subscriptionId, amountDue, currency, dueDate, status]
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        amountDue:
          type: number
          format: double
        currency:
          type: string
        dueDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [Pending, Paid, Failed, PastDue]
        hostedInvoiceUrl:
          type: string
          format: uri
        pdfUrl:
          type: string
          format: uri
    PlanDto:
      type: object
      required: [id, name, currency, amount, interval]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
        amount:
          type: number
          format: double
        interval:
          type: string
          enum: [Monthly, Yearly]
        description:
          type: string
        features:
          type: array
          items:
            type: string
    UsageSnapshotDto:
      type: object
      required: [periodStart, periodEnd, unitsConsumed, unitType]
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        unitsConsumed:
          type: number
          format: double
        unitType:
          type: string
        cost:
          type: number
          format: double
        currency:
          type: string
    SystemHealthDto:
      type: object
      required: [status, environment, timestamp]
      properties:
        status:
          type: string
        environment:
          type: string
        timestamp:
          type: string
          format: date-time
    SystemVersionDto:
      type: object
      required: [version, environment]
      properties:
        version:
          type: string
        environment:
          type: string
    AuditEntryDto:
      type: object
      required: [id, action, actor, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actor:
          type: string
        occurredAt:
          type: string
          format: date-time
        target:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
