openapi: 3.0.3
info:
  title: HR Platform Core Services API
  version: 0.3.0
  description: >-
    RESTful endpoints powering the core HR platform modules including organization
    structure, time management, leave, payroll, performance, recruitment,
    training, communications, and analytics.
servers:
  - url: https://localhost:5001
paths:
  /api/departments:
    get:
      summary: Retrieve all departments
      tags: [Organization]
      responses:
        '200':
          description: A list of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentDto'
    post:
      summary: Create a department
      tags: [Organization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: Newly created department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDto'
        '400':
          description: Validation failure
  /api/departments/{id}:
    get:
      summary: Retrieve a department by id
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Department details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDto'
        '404':
          description: Department not found
    put:
      summary: Update a department
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          description: Updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDto'
        '400':
          description: Validation failure
        '404':
          description: Department not found
    delete:
      summary: Delete a department
      tags: [Organization]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Department deleted
        '404':
          description: Department not found
  /api/organization-units:
