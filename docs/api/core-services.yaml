      summary: Delete an employee
      tags: [Employees]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Employee deleted
        '404':
          description: Employee not found
  /api/employees/search:
    get:
      summary: Search employees with filters and pagination
      tags: [Employees]
      parameters:
        - in: query
          name: query
          schema:
            type: string
            maxLength: 200
          description: Free-text search across name, email, and job title
        - in: query
          name: departmentId
          schema:
            type: string
            format: uuid
          description: Limit results to a specific department
        - in: query
          name: jobTitle
          schema:
            type: string
            maxLength: 150
          description: Restrict results to a given job title fragment
        - in: query
          name: isActive
          schema:
            type: boolean
          description: Filter by active (true) or inactive (false) employees
        - in: query
          name: hiredFrom
          schema:
            type: string
            format: date
          description: Only include employees hired on or after this date
        - in: query
          name: hiredTo
          schema:
            type: string
            format: date
          description: Only include employees hired on or before this date
        - in: query
          name: employmentEndFrom
          schema:
            type: string
            format: date
          description: Include employees whose employment ended on or after this date
        - in: query
          name: employmentEndTo
          schema:
            type: string
            format: date
          description: Include employees whose employment ended on or before this date
        - in: query
          name: pageNumber
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page index
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
          description: Number of records to return per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [lastName, employmentStartDate, employmentEndDate, jobTitle, tenure]
            default: lastName
          description: Field used to sort results
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [ascending, descending]
            default: ascending
          description: Direction to apply when ordering results
      responses:
        '200':
          description: Paged employees matching the supplied filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeResponse'
        '400':
          description: Validation failure
