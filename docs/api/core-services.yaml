openapi: 3.0.3
info:
  title: HR Platform Core Services API
  version: 0.3.0
  description: >-
    RESTful endpoints powering the core HR platform modules including organization
    structure, time management, leave, payroll, performance, recruitment,
    training, communications, and analytics.
servers:
  - url: https://localhost:5001
