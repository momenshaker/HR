  /api/attendancerecords:
    get:
      summary: Retrieve all attendance records
      description: >-
        Surfaces shift orchestration data, captured working time, entitlement
        policy usage, approval routing history, and up-to-date balance
        reconciliation for workforce planning.
      tags: [Attendance]
      responses:
        '200':
          description: A list of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecordDto'
    post:
      summary: Create an attendance record
      description: >-
        Register worked time against shift plans while applying entitlement
        policies, triggering approval flows, and reconciling balances in
        real time.
      tags: [Attendance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttendanceRecordRequest'
      responses:
        '201':
          description: Newly created attendance record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordDto'
        '400':
          description: Validation failure
  /api/attendancerecords/{id}:
    get:
      summary: Retrieve an attendance record by id
      description: >-
        Inspect a single attendance record including shift orchestration
        details, captured time entries, entitlement usage, approval history,
        and current balance impact.
      tags: [Attendance]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Attendance record details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordDto'
        '404':
          description: Record not found
    put:
      summary: Update an attendance record
      description: >-
        Amend shift assignments, captured time, entitlement allocations, or
        approval outcomes while ensuring balances stay reconciled in real
        time.
      tags: [Attendance]
      parameters:
