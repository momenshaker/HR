components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the resource
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the employee invoking the self-service endpoint
    AttendanceRecordId:
      name: attendanceRecordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the attendance record
  schemas:
    DepartmentDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        parentDepartmentId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        branch:
          type: string
        location:
          type: string
        description:
          type: string
        isActive:
          type: boolean
      required: [id, name, code, isActive]
    CreateDepartmentRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateDepartmentRequest'
      required: [name, code]
    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        parentDepartmentId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        branch:
          type: string
        location:
          type: string
        description:
          type: string
        isActive:
          type: boolean
      required: [name, code, isActive]
    OrganizationUnitDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        type:
          type: string
        parentUnitId:
          type: string
          format: uuid
          nullable: true
        departmentId:
          type: string
          format: uuid
          nullable: true
        leadPositionId:
          type: string
          format: uuid
          nullable: true
        level:
          type: integer
        description:
          type: string
        isActive:
          type: boolean
      required: [id, name, code, type, level, isActive]
    CreateOrganizationUnitRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateOrganizationUnitRequest'
      required: [name, code, type]
    UpdateOrganizationUnitRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        type:
          type: string
        parentUnitId:
          type: string
          format: uuid
          nullable: true
        departmentId:
          type: string
          format: uuid
          nullable: true
        leadPositionId:
          type: string
          format: uuid
          nullable: true
        level:
          type: integer
        description:
          type: string
        isActive:
          type: boolean
      required: [name, code, type, level, isActive]
    OrganizationHierarchyNodeDto:
      type: object
      properties:
        unit:
          $ref: '#/components/schemas/OrganizationUnitDto'
        children:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationHierarchyNodeDto'
      required: [unit, children]
    PositionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        jobCode:
          type: string
        organizationUnitId:
          type: string
          format: uuid
        reportsToPositionId:
          type: string
          format: uuid
          nullable: true
        occupiedByEmployeeId:
          type: string
          format: uuid
          nullable: true
        grade:
          type: string
        employmentType:
          type: string
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        isCriticalRole:
          type: boolean
        isVacant:
          type: boolean
      required: [id, title, jobCode, organizationUnitId, isCriticalRole, isVacant]
    CreatePositionRequest:
      allOf:
        - $ref: '#/components/schemas/UpdatePositionRequest'
      required: [title, jobCode, organizationUnitId]
    UpdatePositionRequest:
      type: object
      properties:
        title:
          type: string
        jobCode:
          type: string
        organizationUnitId:
          type: string
          format: uuid
        reportsToPositionId:
          type: string
          format: uuid
          nullable: true
        occupiedByEmployeeId:
          type: string
          format: uuid
          nullable: true
        grade:
          type: string
        employmentType:
          type: string
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        isCriticalRole:
          type: boolean
        isVacant:
          type: boolean
      required: [title, jobCode, organizationUnitId, isCriticalRole, isVacant]
    ReportingRelationshipDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        managerPositionId:
          type: string
          format: uuid
        reportPositionId:
          type: string
          format: uuid
        relationshipType:
          type: string
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        isPrimary:
          type: boolean
      required: [id, managerPositionId, reportPositionId, relationshipType, isPrimary]
    CreateReportingRelationshipRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateReportingRelationshipRequest'
      required: [managerPositionId, reportPositionId, relationshipType]
    UpdateReportingRelationshipRequest:
      type: object
      properties:
        managerPositionId:
          type: string
          format: uuid
        reportPositionId:
          type: string
          format: uuid
        relationshipType:
          type: string
        effectiveFrom:
          type: string
          format: date
          nullable: true
        effectiveTo:
          type: string
          format: date
          nullable: true
        isPrimary:
          type: boolean
      required: [managerPositionId, reportPositionId, relationshipType, isPrimary]
    DelegatedAuthorityDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        grantorEmployeeId:
          type: string
