components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier of the resource
  schemas:
    DepartmentDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        parentDepartmentId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        branch:
          type: string
        location:
          type: string
        description:
          type: string
        isActive:
          type: boolean
      required: [id, name, code, isActive]
    CreateDepartmentRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateDepartmentRequest'
      required: [name, code]
    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        parentDepartmentId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        branch:
          type: string
        location:
          type: string
        description:
          type: string
        isActive:
          type: boolean
      required: [name, code, isActive]
    EmployeeDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        jobTitle:
          type: string
        departmentId:
          type: string
          format: uuid
        employmentStartDate:
          type: string
          format: date
        employmentEndDate:
          type: string
          format: date
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
      required: [id, firstName, lastName, email, jobTitle, departmentId, employmentStartDate]
    CreateEmployeeRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        departmentId:
          type: string
          format: uuid
        employmentStartDate:
          type: string
          format: date
        jobTitle:
          type: string
        employmentEndDate:
          type: string
          format: date
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
      required: [firstName, lastName, email, departmentId, employmentStartDate, jobTitle]
    UpdateEmployeeRequest:
      allOf:
        - $ref: '#/components/schemas/CreateEmployeeRequest'
    EmployeeDepartmentHeadcountDto:
      type: object
      properties:
        departmentId:
          type: string
          format: uuid
        departmentName:
          type: string
        activeEmployees:
          type: integer
        totalEmployees:
          type: integer
      required: [departmentId, departmentName, activeEmployees, totalEmployees]
    EmployeeWorkforceSnapshotDto:
      type: object
      properties:
        totalEmployees:
          type: integer
        activeEmployees:
          type: integer
        inactiveEmployees:
          type: integer
        newHiresLast30Days:
          type: integer
        departuresLast30Days:
          type: integer
        upcomingDeparturesNext30Days:
          type: integer
        averageTenureInYears:
          type: number
          format: double
        departmentHeadcounts:
          type: array
          items:
