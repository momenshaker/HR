          description: Newly created employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
        '400':
          description: Validation failure
  /api/employees/{id}:
    get:
      summary: Retrieve an employee by id
      tags: [Employees]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Employee details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
        '404':
